    <script>
      // Conditionele hero-image preload — alleen op de marketing landing (`/`)
      // en `/site/<slug>` (public tenant landing). Op andere routes (admin,
      // kiosk, login) is de hero-visual nooit nodig; een onbenutte preload
      // veroorzaakt een console warning en verspilt bandbreedte.
      (function () {
        try {
          var p = (window.location.pathname || '').toLowerCase();
          var isMarketing = p === '/' || p === '' || p.indexOf('/site/') === 0;
          if (!isMarketing) return;
          // Preconnect naar assets-CDN (TCP+TLS handshake vast open).
          var pc = document.createElement('link');
          pc.rel = 'preconnect';
          pc.href = 'https://customer-assets.emergentagent.com';
          pc.crossOrigin = 'anonymous';
          document.head.appendChild(pc);
          // Preload van de hero achtergrondafbeelding (LCP-kandidaat).
          var pl = document.createElement('link');
          pl.rel = 'preload';
          pl.as = 'image';
          pl.setAttribute('fetchpriority', 'high');
          pl.href = 'https://customer-assets.emergentagent.com/job_vastgoed-app/artifacts/7sx9hgg7_1.png';
          document.head.appendChild(pl);
        } catch (e) { /* noop */ }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>App</title>
    <script>
      // ===========================================================
      // PWA-rol detectie — DRAAIT ALS EERSTE, vóór alle andere scripts
      // iOS Safari leest `<title>` en `apple-mobile-web-app-title` op het
      // moment van "Toevoegen aan beginscherm". Dit script zet ze meteen
      // afhankelijk van de URL zodat de gebruiker de juiste naam krijgt.
      // ===========================================================
      (function () {
        try {
          var ROLES = {
            beheer:  { name: 'Beheer',         theme: '#FFF7F0', icon: 'beheer'   },
            kiosk:   { name: 'Kiosk',          theme: '#2563EB', icon: 'kioskpwa' },
            huurder: { name: 'Huurder',        theme: '#10B981', icon: 'huurder'  },
            klant:   { name: 'Klantenscherm',  theme: '#9333EA', icon: 'klant'    }
          };
          var p = (location.pathname || '').toLowerCase();
          var sub = p;
          if (p.indexOf('/c/') === 0) sub = '/' + p.split('/').slice(3).join('/');
          var role = 'beheer';
          // BELANGRIJK: specifieke routes EERST (kiosk/klant, kiosk/huurder)
          // VOORDAT we de algemene /kiosk match doen, anders worden
          // /kiosk/huurder en /kiosk/klant verkeerd als 'kiosk' herkend.
          if (sub.indexOf('/admin') === 0) role = 'beheer';
          else if (sub.indexOf('/kiosk/klant') === 0) role = 'klant';
          else if (sub.indexOf('/kiosk/huurder') === 0) role = 'huurder';
          else if (sub === '/kiosk' || sub.indexOf('/kiosk/') === 0 || sub.indexOf('/kiosk') === 0) role = 'kiosk';
          // /login route met target hint → leid af
          if (sub === '/login' || sub.indexOf('/login') === 0) {
            var qs = location.search || '';
            if (qs.indexOf('target=kiosk') !== -1) role = 'kiosk';
            else if (qs.indexOf('target=huurder') !== -1) role = 'huurder';
            else if (qs.indexOf('target=klant') !== -1) role = 'klant';
            else if (qs.indexOf('view=admin') !== -1 || qs.indexOf('target=admin') !== -1) role = 'beheer';
            else role = 'beheer';
          }
          var cfg = ROLES[role];
          // Belangrijk: zet <title> EERSTE — iOS gebruikt dit als default in
          // "Voeg toe aan beginscherm" dialoog.
          document.title = cfg.name;

          var manifest = document.querySelector('link[rel="manifest"]');
          // Detecteer bedrijfs-slug uit pad: /<slug>/login etc.
          // Reserved slugs (admin, kiosk, login, etc.) zijn geen bedrijfs-slug.
          var RESERVED = ['admin','kiosk','login','demo','huurder','klant','onderteken','qr-link','c','api','assets'];
          var slug = '';
          var seg = p.split('/').filter(Boolean);
          if (seg.length > 0 && RESERVED.indexOf(seg[0]) === -1) {
            slug = seg[0];
          }
          if (manifest) {
            // Stabiele backend-URL met slug+role query — vervangt de oude
            // blob-URL approach (die alleen tijdens document-sessie geldig
            // was). Hierdoor kan een geïnstalleerde PWA de manifest later
            // refresht en blijft `start_url` in het bedrijfs-context.
            var manifestUrl = '/api/pwa/manifest?role=' + encodeURIComponent(role);
            if (slug) manifestUrl += '&slug=' + encodeURIComponent(slug);
            manifest.setAttribute('href', manifestUrl);
          }
          var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (t) t.setAttribute('content', cfg.name);
          var an = document.querySelector('meta[name="application-name"]');
          if (an) an.setAttribute('content', cfg.name);
          var th = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < th.length; i++) th[i].setAttribute('content', cfg.theme);
          var icons = document.querySelectorAll('link[rel="apple-touch-icon"]');
          for (var j = 0; j < icons.length; j++) {
            var h = icons[j].getAttribute('href') || '';
            var match = h.match(/^(\/kiosk-icons\/)([a-z]+)(-\d+\.png)$/i);
            if (match) icons[j].setAttribute('href', match[1] + cfg.icon + match[3]);
          }
        } catch (e) { /* no-op */ }
      })();
    </script>
    <script>
      // First-paint background: voorkomt witte flits + witte strook onderaan
      // op iOS PWA standalone. Voor /login en /kiosk → oranje (brand). Voor
      // alle andere routes (admin, huurder) → cream zodat Safari's URL-bar
      // de cream kleur erft i.p.v. oranje.
      (function () {
        try {
          var p = (window.location.pathname || '').toLowerCase();
          var isKiosk = p === '/kiosk' || p.indexOf('/kiosk') === 0;
          var isLogin = p === '/login' || p.indexOf('/login') === 0;
          var BG = (isKiosk || isLogin) ? '#FF5C00' : '#FFF7F0';
          document.documentElement.style.backgroundColor = BG;
          var applyBody = function () {
            if (document.body) document.body.style.backgroundColor = BG;
          };
          if (document.body) applyBody();
          else document.addEventListener('DOMContentLoaded', applyBody);
        } catch (e) { /* no-op */ }
      })();
    </script>
    <script>
      // PWA slug-recovery — KRITIEK voor iOS PWA's die geïnstalleerd zijn
      // met een OUDE manifest start_url (bv. /login zonder slug).
      //
      // Wanneer we openen op een generieke route (/, /login, /admin) MAAR
      // er een eerder opgeslagen bedrijfs-slug bestaat in localStorage,
      // redirecten we direct naar de branded variant. Dit gebeurt VOOR
      // React mount zodat de gebruiker nooit de generieke /login page ziet.
      (function () {
        try {
          var p = (window.location.pathname || '').toLowerCase();
          var RESERVED = ['admin','kiosk','login','demo','huurder','klant','onderteken','qr-link','c','api','assets','static','vastgoed'];
          // Alleen op generieke/reserved routes. Sla over als al binnen /<slug>/.
          var firstSeg = p.split('/').filter(Boolean)[0] || '';
          var alreadyBranded = firstSeg && RESERVED.indexOf(firstSeg) === -1;
          if (alreadyBranded) return;
          // Niet redirecten op marketing landing (/) of qr-link / onderteken (tokens).
          if (p === '/onderteken' || p.indexOf('/onderteken/') === 0) return;
          if (p === '/qr-link' || p.indexOf('/qr-link') === 0) return;
          // Alleen /login (en /admin als PWA opent op /admin direct).
          var isLoginRoute = p === '/login' || p === '/login/' || p.indexOf('/login') === 0;
          var isAdminRoute = p === '/admin' || p.indexOf('/admin/') === 0 || p === '/admin/';
          if (!isLoginRoute && !isAdminRoute) return;
          // Geen redirect als de URL al een ?c=slug bevat (legacy branded-query).
          if ((location.search || '').toLowerCase().indexOf('c=') > -1) return;
          var stored = '';
          try { stored = (localStorage.getItem('pwa_company_slug') || '').trim().toLowerCase(); } catch (e) {}
          if (!stored) return;
          if (!/^[a-z0-9][a-z0-9-]{0,62}$/.test(stored)) return;
          // Bouw target: /<slug>/login of /<slug>/admin met behoud van query.
          var basePath = isAdminRoute ? '/admin' : '/login';
          var target = '/' + stored + basePath + (location.search || '') + (location.hash || '');
          window.location.replace(target);
        } catch (e) { /* no-op — fall through naar React */ }
      })();
    </script>

    <!-- (oudere PWA-rol detectie is vervangen door het inline-script
         bovenin de <head> dat eerder draait dan de brand-color injector
         en de juiste <title>/manifest/icon set vóór React mount.) -->

    <!-- Landing content marker — bij `yarn build` vervangt
         scripts/inline-landing-content.js deze comment door een
         <script>window.__LANDING_CONTENT__=…</script> tag met de
         gepubliceerde marketing content. Blijft leeg in dev / bij
         backend-onbereikbaarheid; frontend faalt dan terug op de
         runtime fetch. -->
    <!--__LANDING_CONTENT__-->
