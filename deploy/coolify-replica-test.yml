# Isolated synthetic-data test only. Do not attach existing volumes or data.
services:
  source:
    profiles: ["rehearsal"]
    image: mongo:7.0.48
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}
    volumes:
      - source_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  database:
    image: mongo:7.0.48
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}
      MONGO_REPLICA_KEY: ${SERVICE_BASE64_64_REPLICA:?Set a test-only replica key}
    entrypoint:
      - bash
      - -ec
      - |
        install -d -m 0700 -o mongodb -g mongodb /run/mongo-replica
        umask 077
        printf '%s' "$$MONGO_REPLICA_KEY" > /run/mongo-replica/key
        chown mongodb:mongodb /run/mongo-replica/key
        chmod 0400 /run/mongo-replica/key
        unset MONGO_REPLICA_KEY
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /run/mongo-replica/key
    volumes:
      - test_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  replica-init:
    image: mongo:7.0.48
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}
    entrypoint:
      - mongosh
      - --quiet
      - mongodb://database:27017/?directConnection=true
      - --eval
      - |
        const admin = db.getSiblingDB("admin");
        if (!admin.auth(process.env.MONGO_ROOT_USERNAME, process.env.MONGO_ROOT_PASSWORD)) throw new Error("Authentication failed");
        const expected = { _id: "rs0", members: [{ _id: 0, host: "database:27017" }] };
        let status;
        try {
          status = admin.runCommand({ replSetGetStatus: 1 });
        } catch (error) {
          if (error.code !== 94) throw error;
          status = { ok: 0, code: error.code };
        }
        if (status.ok !== 1 && status.code === 94) {
          const result = admin.runCommand({ replSetInitiate: expected });
          if (result.ok !== 1) throw new Error("Replica initialization failed");
        } else if (status.ok !== 1) {
          throw new Error("Replica status failed");
        }
        const config = admin.runCommand({ replSetGetConfig: 1 });
        if (config.ok !== 1 || config.config._id !== "rs0"
            || config.config.members.length !== 1 || config.config.members[0]._id !== 0
            || config.config.members[0].host !== "database:27017") {
          throw new Error("Unexpected replica configuration; manual review required");
        }
        for (let i = 0; i < 120; i++) {
          if (admin.runCommand({ hello: 1 }).isWritablePrimary) {
            print("Replica set is ready");
            quit(0);
          }
          sleep(1000);
        }
        throw new Error("Replica did not elect a primary");

  probe:
    image: mongo:7.0.48
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}

  app-test:
    image: ${TEST_APP_IMAGE:?Set the local test app image}
    pull_policy: never
    restart: unless-stopped
    environment: &test_app_environment
      MONGO_URL: mongodb://testuser:${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}@database:27017/synthetic_app?authSource=admin&replicaSet=rs0
      DB_NAME: synthetic_app
      JWT_SECRET: ${SERVICE_PASSWORD_JWTTEST:?Set a test-only secret}
      PDF_AES_PASSWORD: ${SERVICE_PASSWORD_PDFTEST:?Set a test-only password}
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMINTEST:?Set a test-only password}
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: ${SERVICE_PASSWORD_SUPERTEST:?Set a test-only password}
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
      RESEED_DEMO_TENANT_PIN: "0"
      DISABLE_DEMO_RESET: "1"
      DISABLE_TRIAL_REMINDERS: "1"
      DISABLE_OVERDUE_PUSH: "1"
      DISABLE_AUTO_INVOICE: "1"
      DISABLE_BILLING_CRON: "1"
      DISABLE_INSTALLMENT_REMINDERS: "1"
    depends_on:
      replica-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app-rehearsal-target:
    profiles: ["rehearsal"]
    image: ${TEST_APP_IMAGE:?Set the local test app image}
    pull_policy: never
    restart: "no"
    environment:
      <<: *test_app_environment
      MONGO_URL: mongodb://testuser:${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}@database:27017/synthetic_migration?authSource=admin&replicaSet=rs0
      DB_NAME: synthetic_migration
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app-rehearsal-source:
    profiles: ["rehearsal"]
    image: ${TEST_APP_IMAGE:?Set the local test app image}
    pull_policy: never
    restart: "no"
    environment:
      <<: *test_app_environment
      MONGO_URL: mongodb://testuser:${SERVICE_PASSWORD_MONGOTEST:?Set a test-only password}@source:27017/synthetic_migration?authSource=admin
      DB_NAME: synthetic_migration
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  test_data:
  source_data:
