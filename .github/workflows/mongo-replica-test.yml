name: MongoDB replica deployment test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.replica-test.yml'
      - 'deploy/mongo-replica/**'
      - '.github/workflows/mongo-replica-test.yml'

permissions:
  contents: read

jobs:
  replica-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: surirent-replica-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.replica-test.yml
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: testpassword
      MONGO_REPLICA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      JWT_SECRET: test-only-jwt-secret
      PDF_AES_PASSWORD: test-only-pdf-password
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: test-only-superadmin-password
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start replica set
        run: docker compose up -d database replica-init
      - name: Verify transactions and restart
        shell: bash
        run: |
          set -eu
          wait_for_initializer() {
            for i in {1..120}; do
              container="$(docker compose ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                docker compose logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            docker compose logs database replica-init
            return 1
          }
          verify_transaction() {
            docker compose exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const session = db.getMongo().startSession();
              const testDb = session.getDatabase("replica_ci");
              session.startTransaction();
              testDb.checks.insertOne({value: 1});
              session.commitTransaction();
              if (testDb.checks.countDocuments({value: 1}) !== 1) throw new Error("Transaction not committed");
              session.startTransaction();
              testDb.checks.insertOne({value: 2});
              session.abortTransaction();
              if (testDb.checks.countDocuments({value: 2}) !== 0) throw new Error("Transaction not rolled back");
              testDb.checks.deleteMany({});
              session.endSession();
            '
          }
          wait_for_initializer
          if docker compose exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' \
            --username "$MONGO_ROOT_USERNAME" --password wrong-password --authenticationDatabase admin \
            --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; then
            echo "Invalid MongoDB credentials unexpectedly succeeded" >&2
            exit 1
          fi
          verify_transaction
          docker compose restart database
          docker compose up -d --force-recreate replica-init
          wait_for_initializer
          verify_transaction
      - name: Remove isolated containers and volume
        if: always()
        run: docker compose down --volumes --remove-orphans

  existing-volume-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: surirent-mongo-migration-ci
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: testpassword
      MONGO_REPLICA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      JWT_SECRET: test-only-jwt-secret
      PDF_AES_PASSWORD: test-only-pdf-password
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: test-only-superadmin-password
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated standalone database
        shell: bash
        run: |
          set -eu
          docker compose -f docker-compose.yml up -d --wait database
          docker compose -f docker-compose.yml exec -T database mongosh --quiet \
            'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const testDb = db.getSiblingDB("migration_ci");
              testDb.invoices.createIndex({id: 1}, {unique: true});
              testDb.invoices.insertOne({id: "invoice-1", tenant_id: "tenant-1", amount: 100, paid_amount: 25});
              testDb.payments.insertOne({id: "payment-1", tenant_id: "tenant-1", amount: 25});
            '
          docker compose -f docker-compose.yml stop database
      - name: Rehearse replica conversion on the isolated volume
        shell: bash
        run: |
          set -eu
          compose=(docker compose -f docker-compose.yml -f docker-compose.replica-test.yml)
          "${compose[@]}" up -d database replica-init
          wait_for_initializer() {
            for i in {1..120}; do
              container="$("${compose[@]}" ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                "${compose[@]}" logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            "${compose[@]}" logs database replica-init
            return 1
          }
          verify_data_and_transactions() {
            "${compose[@]}" exec -T database mongosh --quiet \
              'mongodb://database:27017/?replicaSet=rs0' --eval '
                if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
                const testDb = db.getSiblingDB("migration_ci");
                const invoice = testDb.invoices.findOne({id: "invoice-1"});
                if (!invoice || invoice.amount !== 100 || invoice.paid_amount !== 25) throw new Error("Invoice changed or missing");
                if (testDb.payments.countDocuments({id: "payment-1", amount: 25}) !== 1) throw new Error("Payment changed or missing");
                if (!testDb.invoices.getIndexes().some(index => index.unique && index.key.id === 1)) throw new Error("Unique invoice index missing");
                const session = db.getMongo().startSession();
                const checks = session.getDatabase("migration_ci").checks;
                session.startTransaction();
                checks.insertOne({id: "committed"});
                session.commitTransaction();
                session.startTransaction();
                checks.insertOne({id: "aborted"});
                session.abortTransaction();
                if (checks.countDocuments({id: "committed"}) !== 1 || checks.countDocuments({id: "aborted"}) !== 0) throw new Error("Transaction verification failed");
                checks.deleteMany({});
                session.endSession();
              '
          }
          wait_for_initializer
          verify_data_and_transactions
          "${compose[@]}" restart database
          "${compose[@]}" up -d --force-recreate replica-init
          wait_for_initializer
          verify_data_and_transactions
      - name: Remove isolated containers and volume
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.replica-test.yml down --volumes --remove-orphans

  standalone-copy-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare isolated standalone database and key
        shell: bash
        run: |
          set -eu
          docker volume create sms-replica-copy-ci-data
          docker volume create sms-replica-copy-ci-config
          docker run -d --name sms-replica-copy-ci \
            -e MONGO_INITDB_ROOT_USERNAME=testuser -e MONGO_INITDB_ROOT_PASSWORD=testpassword \
            -v sms-replica-copy-ci-data:/data/db -v sms-replica-copy-ci-config:/data/configdb \
            mongo:7.0.48 --bind_ip_all
          for i in {1..120}; do
            if docker exec sms-replica-copy-ci mongosh --quiet --eval '
                db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) &&
                db.adminCommand({ping: 1}).ok
              ' | grep -qx 1; then
              break
            fi
            if [ "$i" = 120 ]; then exit 1; fi
            sleep 1
          done
          docker exec sms-replica-copy-ci mongosh --quiet --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            db.getSiblingDB("copy_ci").invoices.insertOne({id: "invoice-1", amount: 100, paid_amount: 25});
          '
          docker exec sms-replica-copy-ci bash -c '
            set -eu
            key=/data/configdb/replica-test.key
            test ! -e "$key"
            umask 077
            openssl rand -base64 48 > "$key"
            chown mongodb:mongodb "$key"
            chmod 0400 "$key"
          '
          cat > mongo-copy-test.conf <<'EOF'
          storage:
            dbPath: /data/db
          net:
            bindIpAll: true
          security:
            authorization: enabled
            keyFile: /data/configdb/replica-test.key
          replication:
            replSetName: rs0
          EOF
          docker cp mongo-copy-test.conf sms-replica-copy-ci:/data/configdb/mongo-copy-test.conf
      - name: Convert the isolated copy and verify restart
        shell: bash
        run: |
          set -eu
          docker stop sms-replica-copy-ci
          docker rm sms-replica-copy-ci
          docker run -d --name sms-replica-copy-ci \
            -e MONGO_INITDB_ROOT_USERNAME=testuser -e MONGO_INITDB_ROOT_PASSWORD=testpassword \
            -v sms-replica-copy-ci-data:/data/db -v sms-replica-copy-ci-config:/data/configdb \
            mongo:7.0.48 --config /data/configdb/mongo-copy-test.conf
          wait_for_ping() {
            for i in {1..120}; do
              if docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
                  db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) &&
                  db.adminCommand({ping: 1}).ok
                ' | grep -qx 1; then
                return
              fi
              sleep 1
            done
            docker logs sms-replica-copy-ci
            return 1
          }
          wait_for_primary() {
            for i in {1..120}; do
              if docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
                  db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) &&
                  db.hello().isWritablePrimary
                ' | grep -qx true; then
                return
              fi
              sleep 1
            done
            docker logs sms-replica-copy-ci
            return 1
          }
          verify() {
            docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const testDb = db.getSiblingDB("copy_ci");
              if (testDb.invoices.countDocuments({id: "invoice-1", amount: 100, paid_amount: 25}) !== 1) throw new Error("Original invoice changed");
              const session = db.getMongo().startSession();
              const checks = session.getDatabase("copy_ci").checks;
              session.startTransaction();
              checks.insertOne({id: "committed"});
              session.commitTransaction();
              session.startTransaction();
              checks.insertOne({id: "aborted"});
              session.abortTransaction();
              if (checks.countDocuments({id: "committed"}) !== 1 || checks.countDocuments({id: "aborted"}) !== 0) throw new Error("Transaction failed");
              checks.deleteMany({});
              session.endSession();
            '
          }
          wait_for_ping
          docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            if (result.ok !== 1) throw new Error("Replica set initialization failed");
          '
          wait_for_primary
          verify
          docker restart sms-replica-copy-ci
          wait_for_ping
          wait_for_primary
          verify
      - name: Remove isolated container and volumes
        if: always()
        run: |
          docker rm -f sms-replica-copy-ci || true
          docker volume rm sms-replica-copy-ci-data sms-replica-copy-ci-config || true
