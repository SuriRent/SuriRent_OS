name: MongoDB replica deployment test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.replica-test.yml'
      - 'docker-compose.sandbox-cutover.yml'
      - 'deploy/mongo-replica/**'
      - 'deploy/coolify-replica-test.yml'
      - 'deploy/coolify-cutover-rehearsal.yml'
      - '.github/workflows/mongo-replica-test.yml'

permissions:
  contents: read

jobs:
  coolify-template-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_PASSWORD_MONGOTEST: ci-test-only-password
      SERVICE_BASE64_64_REPLICA: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      SERVICE_PASSWORD_JWTTEST: ci-only-jwt-secret
      SERVICE_PASSWORD_PDFTEST: ci-only-pdf-password
      SERVICE_PASSWORD_ADMINTEST: ci-only-admin-password
      SERVICE_PASSWORD_SUPERTEST: ci-only-super-password
      TEST_APP_IMAGE: surirent-coolify-app-ci:local
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated Compose template
        shell: bash
        run: |
          set -eu
          compose=(docker compose -p surirent-coolify-template-ci -f deploy/coolify-replica-test.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d database replica-init probe
          wait_for_initializer() {
            for i in {1..120}; do
              container="$("${compose[@]}" ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                "${compose[@]}" logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            "${compose[@]}" logs database replica-init
            return 1
          }
          verify_from_probe() {
            "${compose[@]}" exec -T probe mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' --eval '
              const admin = db.getSiblingDB("admin");
              if (!admin.auth(process.env.MONGO_ROOT_USERNAME, process.env.MONGO_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const hello = admin.runCommand({hello: 1});
              if (hello.setName !== "rs0" || !hello.isWritablePrimary) throw new Error("Writable replica not reached");
              const session = db.getMongo().startSession();
              const checks = session.getDatabase("synthetic_test").checks;
              session.startTransaction();
              checks.insertOne({_id: "commit"});
              session.commitTransaction();
              session.startTransaction();
              checks.insertOne({_id: "abort"});
              session.abortTransaction();
              if (checks.countDocuments({_id: "commit"}) !== 1 || checks.countDocuments({_id: "abort"}) !== 0) throw new Error("Transaction check failed");
              checks.deleteMany({});
              session.endSession();
            '
          }
          wait_for_initializer
          verify_from_probe
          "${compose[@]}" restart database
          "${compose[@]}" up -d --force-recreate replica-init
          wait_for_initializer
          verify_from_probe
      - name: Verify the app against the isolated replica
        shell: bash
        run: |
          set -eu
          docker build --quiet --target app -t "$TEST_APP_IMAGE" .
          export TEST_APP_IMAGE="$(docker image inspect --format '{{.Id}}' "$TEST_APP_IMAGE")"
          compose=(docker compose -p surirent-coolify-template-ci -f deploy/coolify-replica-test.yml)
          if ! "${compose[@]}" up -d --no-deps --wait --wait-timeout 180 app-test; then
            "${compose[@]}" logs app-test
            exit 1
          fi
          "${compose[@]}" exec -T app-test python - <<'PY'
          import asyncio
          import os
          from motor.motor_asyncio import AsyncIOMotorClient

          async def main():
              client = AsyncIOMotorClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=10000)
              try:
                  hello = await client.admin.command("hello")
                  if hello.get("setName") != "rs0" or not hello.get("isWritablePrimary"):
                      raise RuntimeError("The test app did not reach the writable replica")
                  checks = client[os.environ["DB_NAME"]]["app_connection_checks"]
                  async with await client.start_session() as session:
                      session.start_transaction()
                      await checks.insert_one({"_id": "committed"}, session=session)
                      await session.commit_transaction()
                      session.start_transaction()
                      await checks.insert_one({"_id": "aborted"}, session=session)
                      await session.abort_transaction()
                  if await checks.count_documents({"_id": "committed"}) != 1 or await checks.count_documents({"_id": "aborted"}) != 0:
                      raise RuntimeError("The test app transaction check failed")
                  await checks.delete_one({"_id": "committed"})
              finally:
                  client.close()

          asyncio.run(main())
          print("Test app connection and transactions passed")
          PY
      - name: Rehearse synthetic Coolify copy, cutover and early rollback
        shell: bash
        run: |
          set -eu
          export TEST_APP_IMAGE="$(docker image inspect --format '{{.Id}}' "$TEST_APP_IMAGE")"
          compose=(docker compose -p surirent-coolify-template-ci -f deploy/coolify-replica-test.yml --profile rehearsal)
          "${compose[@]}" up -d --wait --wait-timeout 180 source
          "${compose[@]}" exec -T source mongosh --quiet --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            const d = db.getSiblingDB("synthetic_migration");
            d.checks.createIndex({label: 1}, {unique: true});
            d.checks.insertOne({_id: "original", label: "synthetic"});
          '
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 180 app-rehearsal-source
          "${compose[@]}" stop app-rehearsal-source
          umask 077
          "${compose[@]}" exec -T source sh -c '
            exec mongodump --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin --db synthetic_migration --archive --gzip
          ' > synthetic-migration.archive.gz
          test -s synthetic-migration.archive.gz
          "${compose[@]}" exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            if (db.getSiblingDB("synthetic_migration").getCollectionInfos().length !== 0) throw new Error("Target database is not empty");
          '
          "${compose[@]}" exec -T database sh -c '
            exec mongorestore --host database --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin --archive --gzip
          ' < synthetic-migration.archive.gz
          verify_app() {
            expected="$1"
            service="$2"
            "${compose[@]}" exec -T -e EXPECTED_REPLICA="$expected" "$service" python - <<'PY'
          import asyncio
          import os
          from motor.motor_asyncio import AsyncIOMotorClient

          async def main():
              client = AsyncIOMotorClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=10000)
              try:
                  hello = await client.admin.command("hello")
                  if (hello.get("setName") == "rs0") != (os.environ["EXPECTED_REPLICA"] == "yes"):
                      raise RuntimeError("Application connected to the wrong topology")
                  checks = client[os.environ["DB_NAME"]].checks
                  if await checks.count_documents({"_id": "original", "label": "synthetic"}) != 1:
                      raise RuntimeError("Synthetic record was not preserved")
                  indexes = await checks.index_information()
                  if not any(index.get("unique") and index.get("key") == [("label", 1)] for index in indexes.values()):
                      raise RuntimeError("Synthetic unique index was not preserved")
              finally:
                  client.close()

          asyncio.run(main())
          PY
          }
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 180 app-rehearsal-target
          verify_app yes app-rehearsal-target
          "${compose[@]}" restart database
          "${compose[@]}" up -d --force-recreate replica-init
          for i in {1..120}; do
            init="$("${compose[@]}" ps -aq replica-init)"
            if [ -n "$init" ] && [ "$(docker inspect -f '{{.State.Status}}' "$init")" = "exited" ]; then
              [ "$(docker inspect -f '{{.State.ExitCode}}' "$init")" = "0" ]
              break
            fi
            [ "$i" -lt 120 ]
            sleep 1
          done
          verify_app yes app-rehearsal-target
          "${compose[@]}" stop app-rehearsal-target
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 180 app-rehearsal-source
          verify_app no app-rehearsal-source
      - name: Remove isolated containers and volume
        if: always()
        run: docker compose -p surirent-coolify-template-ci -f deploy/coolify-replica-test.yml --profile rehearsal down --volumes --remove-orphans

  same-stack-cutover-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        variant: [rehearsal, candidate]
    env:
      CUTOVER_VARIANT: ${{ matrix.variant }}
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: testpassword
      MONGO_REPLICA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      DB_NAME: synthetic_migration
      JWT_SECRET: test-only-jwt-secret
      PDF_AES_PASSWORD: test-only-pdf-password
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: test-only-superadmin-password
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse copy, app cutover and early rollback
        shell: bash
        run: |
          set -eu
          cat > cutover-ci-only.yml <<'EOF'
          services:
            database:
              image: mongo:7.0.48
            app:
              environment:
                DISABLE_TRIAL_REMINDERS: "1"
                DISABLE_OVERDUE_PUSH: "1"
                DISABLE_AUTO_INVOICE: "1"
                DISABLE_BILLING_CRON: "1"
                DISABLE_INSTALLMENT_REMINDERS: "1"
          EOF
          base=(docker compose -p surirent-cutover-ci -f docker-compose.yml -f cutover-ci-only.yml)
          if [ "$CUTOVER_VARIANT" = candidate ]; then
            candidate=(docker compose -p surirent-cutover-ci -f docker-compose.sandbox-cutover.yml -f cutover-ci-only.yml)
            target=(env CUTOVER_DATABASE_HOST=replica-database CUTOVER_DATABASE_QUERY='&replicaSet=rs0' docker compose -p surirent-cutover-ci -f docker-compose.sandbox-cutover.yml -f cutover-ci-only.yml)
            "${base[@]}" config --format json | jq -S '.services | {app: (.app | del(.depends_on."replica-init")), web, database}' > cutover-base.json
            "${candidate[@]}" config --format json | jq -S '.services | {app: (.app | del(.depends_on."replica-init")), web, database}' > cutover-candidate.json
            diff -u cutover-base.json cutover-candidate.json
          else
            target=(docker compose -p surirent-cutover-ci -f docker-compose.yml -f cutover-ci-only.yml -f deploy/coolify-cutover-rehearsal.yml)
          fi
          "${target[@]}" config --quiet
          "${base[@]}" up -d --wait --wait-timeout 180 database
          "${base[@]}" exec -T database mongosh --quiet --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Source authentication failed");
            const d = db.getSiblingDB("synthetic_migration");
            d.checks.createIndex({label: 1}, {unique: true});
            d.checks.insertOne({_id: "original", label: "synthetic"});
          '
          "${base[@]}" build --quiet app
          "${base[@]}" up -d --no-deps --wait --wait-timeout 180 app
          "${base[@]}" stop app
          umask 077
          "${base[@]}" exec -T database sh -c '
            exec mongodump --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin --db synthetic_migration --archive --gzip
          ' > cutover-ci.archive.gz
          test -s cutover-ci.archive.gz
          "${target[@]}" up -d replica-database replica-init
          wait_for_initializer() {
            for i in {1..120}; do
              init="$("${target[@]}" ps -aq replica-init)"
              if [ -n "$init" ] && [ "$(docker inspect -f '{{.State.Status}}' "$init")" = "exited" ]; then
                "${target[@]}" logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$init")" = "0" ]
                return
              fi
              sleep 1
            done
            "${target[@]}" logs replica-database replica-init
            return 1
          }
          wait_for_initializer
          source_volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data/db"}}{{.Name}}{{end}}{{end}}' "$("${base[@]}" ps -q database)")"
          target_volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data/db"}}{{.Name}}{{end}}{{end}}' "$("${target[@]}" ps -q replica-database)")"
          [ -n "$source_volume" ] && [ -n "$target_volume" ] && [ "$source_volume" != "$target_volume" ]
          "${target[@]}" exec -T replica-database mongosh --quiet 'mongodb://replica-database:27017/?replicaSet=rs0' --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Replica authentication failed");
            if (db.getSiblingDB("synthetic_migration").getCollectionInfos().length !== 0) throw new Error("Target database is not empty");
          '
          "${target[@]}" exec -T replica-database sh -c '
            exec mongorestore --host replica-database --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin --archive --gzip
          ' < cutover-ci.archive.gz
          verify_app() {
            expected="$1"
            shift
            "$@" exec -T -e EXPECTED_REPLICA="$expected" app python - <<'PY'
          import asyncio
          import os
          from motor.motor_asyncio import AsyncIOMotorClient

          async def main():
              client = AsyncIOMotorClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=10000)
              try:
                  hello = await client.admin.command("hello")
                  if (hello.get("setName") == "rs0") != (os.environ["EXPECTED_REPLICA"] == "yes"):
                      raise RuntimeError("Application connected to the wrong topology")
                  checks = client[os.environ["DB_NAME"]].checks
                  if await checks.count_documents({"_id": "original", "label": "synthetic"}) != 1:
                      raise RuntimeError("Synthetic record was not preserved")
                  indexes = await checks.index_information()
                  if not any(index.get("unique") and index.get("key") == [("label", 1)] for index in indexes.values()):
                      raise RuntimeError("Synthetic unique index was not preserved")
                  if os.environ["EXPECTED_REPLICA"] == "yes":
                      async with await client.start_session() as session:
                          session.start_transaction()
                          await checks.insert_one({"_id": "committed", "label": "committed"}, session=session)
                          await session.commit_transaction()
                          session.start_transaction()
                          await checks.insert_one({"_id": "aborted", "label": "aborted"}, session=session)
                          await session.abort_transaction()
                      if await checks.count_documents({"_id": "committed"}) != 1 or await checks.count_documents({"_id": "aborted"}) != 0:
                          raise RuntimeError("Transaction check failed")
                      await checks.delete_one({"_id": "committed"})
              finally:
                  client.close()

          asyncio.run(main())
          PY
          }
          "${target[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 180 app
          verify_app yes "${target[@]}"
          "${target[@]}" restart replica-database
          "${target[@]}" up -d --force-recreate replica-init
          wait_for_initializer
          verify_app yes "${target[@]}"
          "${target[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 180 replica-database
          "${target[@]}" up -d --no-deps --force-recreate replica-init
          wait_for_initializer
          verify_app yes "${target[@]}"
          "${target[@]}" stop app
          "${base[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 180 app
          verify_app no "${base[@]}"
      - name: Remove isolated containers and volumes
        if: always()
        shell: bash
        run: |
          if [ "$CUTOVER_VARIANT" = candidate ]; then
            docker compose -p surirent-cutover-ci -f docker-compose.sandbox-cutover.yml down --volumes --remove-orphans
          else
            docker compose -p surirent-cutover-ci -f docker-compose.yml -f deploy/coolify-cutover-rehearsal.yml down --volumes --remove-orphans
          fi

  replica-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: surirent-replica-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.replica-test.yml
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: testpassword
      MONGO_REPLICA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      JWT_SECRET: test-only-jwt-secret
      PDF_AES_PASSWORD: test-only-pdf-password
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: test-only-superadmin-password
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start replica set
        run: docker compose up -d database replica-init
      - name: Verify transactions and restart
        shell: bash
        run: |
          set -eu
          wait_for_initializer() {
            for i in {1..120}; do
              container="$(docker compose ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                docker compose logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            docker compose logs database replica-init
            return 1
          }
          verify_transaction() {
            docker compose exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const session = db.getMongo().startSession();
              const testDb = session.getDatabase("replica_ci");
              session.startTransaction();
              testDb.checks.insertOne({value: 1});
              session.commitTransaction();
              if (testDb.checks.countDocuments({value: 1}) !== 1) throw new Error("Transaction not committed");
              session.startTransaction();
              testDb.checks.insertOne({value: 2});
              session.abortTransaction();
              if (testDb.checks.countDocuments({value: 2}) !== 0) throw new Error("Transaction not rolled back");
              testDb.checks.deleteMany({});
              session.endSession();
            '
          }
          wait_for_initializer
          if docker compose exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' \
            --username "$MONGO_ROOT_USERNAME" --password wrong-password --authenticationDatabase admin \
            --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; then
            echo "Invalid MongoDB credentials unexpectedly succeeded" >&2
            exit 1
          fi
          verify_transaction
          docker compose restart database
          docker compose up -d --force-recreate replica-init
          wait_for_initializer
          verify_transaction
      - name: Verify the application container across restarts
        shell: bash
        run: |
          set -eu
          cat > replica-ci-app.yml <<'EOF'
          services:
            app:
              environment:
                DISABLE_TRIAL_REMINDERS: "1"
                DISABLE_OVERDUE_PUSH: "1"
                DISABLE_AUTO_INVOICE: "1"
                DISABLE_BILLING_CRON: "1"
                DISABLE_INSTALLMENT_REMINDERS: "1"
          EOF
          compose=(docker compose -f docker-compose.yml -f docker-compose.replica-test.yml -f replica-ci-app.yml)
          if ! "${compose[@]}" up -d --build --wait --wait-timeout 180 app; then
            "${compose[@]}" logs app database replica-init
            exit 1
          fi
          verify_from_app() {
            "${compose[@]}" exec -T app python - <<'PY'
          import asyncio
          import os
          from motor.motor_asyncio import AsyncIOMotorClient

          async def main():
              client = AsyncIOMotorClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=10000)
              try:
                  hello = await client.admin.command("hello")
                  if hello.get("setName") != "rs0" or not hello.get("isWritablePrimary"):
                      raise RuntimeError("App did not reach the writable replica set")
                  checks = client["replica_ci"]["app_checks"]
                  await checks.delete_many({})
                  async with await client.start_session() as session:
                      session.start_transaction()
                      await checks.insert_one({"_id": "committed"}, session=session)
                      await session.commit_transaction()
                      session.start_transaction()
                      await checks.insert_one({"_id": "aborted"}, session=session)
                      await session.abort_transaction()
                  if await checks.count_documents({"_id": "committed"}) != 1:
                      raise RuntimeError("Committed app transaction is missing")
                  if await checks.count_documents({"_id": "aborted"}) != 0:
                      raise RuntimeError("Aborted app transaction was persisted")
                  await checks.delete_many({})
              finally:
                  client.close()

          asyncio.run(main())
          print("Application container transaction check passed")
          PY
          }
          verify_from_app
          "${compose[@]}" restart database
          "${compose[@]}" up -d --force-recreate replica-init
          wait_for_initializer() {
            for i in {1..120}; do
              container="$("${compose[@]}" ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                "${compose[@]}" logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            "${compose[@]}" logs database replica-init
            return 1
          }
          wait_for_initializer
          verify_from_app
          "${compose[@]}" restart app
          if ! "${compose[@]}" up -d --wait --wait-timeout 180 app; then
            "${compose[@]}" logs app database replica-init
            exit 1
          fi
          verify_from_app
      - name: Remove isolated containers and volume
        if: always()
        run: docker compose down --volumes --remove-orphans

  existing-volume-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: surirent-mongo-migration-ci
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: testpassword
      MONGO_REPLICA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      JWT_SECRET: test-only-jwt-secret
      PDF_AES_PASSWORD: test-only-pdf-password
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: test-only-superadmin-password
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated standalone database
        shell: bash
        run: |
          set -eu
          docker compose -f docker-compose.yml up -d --wait database
          docker compose -f docker-compose.yml exec -T database mongosh --quiet \
            'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const testDb = db.getSiblingDB("migration_ci");
              testDb.invoices.createIndex({id: 1}, {unique: true});
              testDb.invoices.insertOne({id: "invoice-1", tenant_id: "tenant-1", amount: 100, paid_amount: 25});
              testDb.payments.insertOne({id: "payment-1", tenant_id: "tenant-1", amount: 25});
            '
          docker compose -f docker-compose.yml stop database
      - name: Rehearse replica conversion on the isolated volume
        shell: bash
        run: |
          set -eu
          compose=(docker compose -f docker-compose.yml -f docker-compose.replica-test.yml)
          "${compose[@]}" up -d database replica-init
          wait_for_initializer() {
            for i in {1..120}; do
              container="$("${compose[@]}" ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                "${compose[@]}" logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            "${compose[@]}" logs database replica-init
            return 1
          }
          verify_data_and_transactions() {
            "${compose[@]}" exec -T database mongosh --quiet \
              'mongodb://database:27017/?replicaSet=rs0' --eval '
                if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
                const testDb = db.getSiblingDB("migration_ci");
                const invoice = testDb.invoices.findOne({id: "invoice-1"});
                if (!invoice || invoice.amount !== 100 || invoice.paid_amount !== 25) throw new Error("Invoice changed or missing");
                if (testDb.payments.countDocuments({id: "payment-1", amount: 25}) !== 1) throw new Error("Payment changed or missing");
                if (!testDb.invoices.getIndexes().some(index => index.unique && index.key.id === 1)) throw new Error("Unique invoice index missing");
                const session = db.getMongo().startSession();
                const checks = session.getDatabase("migration_ci").checks;
                session.startTransaction();
                checks.insertOne({id: "committed"});
                session.commitTransaction();
                session.startTransaction();
                checks.insertOne({id: "aborted"});
                session.abortTransaction();
                if (checks.countDocuments({id: "committed"}) !== 1 || checks.countDocuments({id: "aborted"}) !== 0) throw new Error("Transaction verification failed");
                checks.deleteMany({});
                session.endSession();
              '
          }
          wait_for_initializer
          verify_data_and_transactions
          "${compose[@]}" restart database
          "${compose[@]}" up -d --force-recreate replica-init
          wait_for_initializer
          verify_data_and_transactions
      - name: Remove isolated containers and volume
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.replica-test.yml down --volumes --remove-orphans

  standalone-copy-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare isolated standalone database and key
        shell: bash
        run: |
          set -eu
          docker volume create sms-replica-copy-ci-data
          docker volume create sms-replica-copy-ci-config
          docker run -d --name sms-replica-copy-ci \
            -e MONGO_INITDB_ROOT_USERNAME=testuser -e MONGO_INITDB_ROOT_PASSWORD=testpassword \
            -v sms-replica-copy-ci-data:/data/db -v sms-replica-copy-ci-config:/data/configdb \
            mongo:7.0.48 --bind_ip_all
          for i in {1..120}; do
            if docker exec sms-replica-copy-ci mongosh --quiet --eval '
                db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) &&
                db.adminCommand({ping: 1}).ok
              ' | grep -qx 1; then
              break
            fi
            if [ "$i" = 120 ]; then exit 1; fi
            sleep 1
          done
          docker exec sms-replica-copy-ci mongosh --quiet --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            db.getSiblingDB("copy_ci").invoices.insertOne({id: "invoice-1", amount: 100, paid_amount: 25});
          '
          docker exec sms-replica-copy-ci bash -c '
            set -eu
            key=/data/configdb/replica-test.key
            test ! -e "$key"
            umask 077
            openssl rand -base64 48 > "$key"
            chown mongodb:mongodb "$key"
            chmod 0400 "$key"
          '
          cat > mongo-copy-test.conf <<'EOF'
          storage:
            dbPath: /data/db
          net:
            bindIpAll: true
          security:
            authorization: enabled
            keyFile: /data/configdb/replica-test.key
          replication:
            replSetName: rs0
          EOF
          docker cp mongo-copy-test.conf sms-replica-copy-ci:/data/configdb/mongo-copy-test.conf
      - name: Convert the isolated copy and verify restart
        shell: bash
        run: |
          set -eu
          docker stop sms-replica-copy-ci
          docker rm sms-replica-copy-ci
          docker run -d --name sms-replica-copy-ci \
            -e MONGO_INITDB_ROOT_USERNAME=testuser -e MONGO_INITDB_ROOT_PASSWORD=testpassword \
            -v sms-replica-copy-ci-data:/data/db -v sms-replica-copy-ci-config:/data/configdb \
            mongo:7.0.48 --config /data/configdb/mongo-copy-test.conf
          wait_for_ping() {
            for i in {1..120}; do
              if docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
                  db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) &&
                  db.adminCommand({ping: 1}).ok
                ' | grep -qx 1; then
                return
              fi
              sleep 1
            done
            docker logs sms-replica-copy-ci
            return 1
          }
          wait_for_primary() {
            for i in {1..120}; do
              if docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
                  db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) &&
                  db.hello().isWritablePrimary
                ' | grep -qx true; then
                return
              fi
              sleep 1
            done
            docker logs sms-replica-copy-ci
            return 1
          }
          verify() {
            docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const testDb = db.getSiblingDB("copy_ci");
              if (testDb.invoices.countDocuments({id: "invoice-1", amount: 100, paid_amount: 25}) !== 1) throw new Error("Original invoice changed");
              const session = db.getMongo().startSession();
              const checks = session.getDatabase("copy_ci").checks;
              session.startTransaction();
              checks.insertOne({id: "committed"});
              session.commitTransaction();
              session.startTransaction();
              checks.insertOne({id: "aborted"});
              session.abortTransaction();
              if (checks.countDocuments({id: "committed"}) !== 1 || checks.countDocuments({id: "aborted"}) !== 0) throw new Error("Transaction failed");
              checks.deleteMany({});
              session.endSession();
            '
          }
          wait_for_ping
          docker exec sms-replica-copy-ci mongosh --quiet 'mongodb://127.0.0.1:27017/?directConnection=true' --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            if (result.ok !== 1) throw new Error("Replica set initialization failed");
          '
          wait_for_primary
          verify
          docker restart sms-replica-copy-ci
          wait_for_ping
          wait_for_primary
          verify
      - name: Remove isolated container and volumes
        if: always()
        run: |
          docker rm -f sms-replica-copy-ci || true
          docker volume rm sms-replica-copy-ci-data sms-replica-copy-ci-config || true

  backup-restore-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGO_ROOT_USERNAME: testuser
      MONGO_ROOT_PASSWORD: testpassword
      MONGO_REPLICA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      JWT_SECRET: test-only-jwt-secret
      PDF_AES_PASSWORD: test-only-pdf-password
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      SUPERADMIN_EMAIL: superadmin@example.test
      SUPERADMIN_PASSWORD: test-only-superadmin-password
      APP_PUBLIC_URL: https://app.example.test
      CORS_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Back up a standalone database and restore to a fresh volume
        shell: bash
        run: |
          set -eu
          source=(docker compose -p surirent-backup-source -f docker-compose.yml)
          target=(docker compose -p surirent-backup-target -f docker-compose.yml)
          "${source[@]}" up -d --wait database
          "${source[@]}" exec -T database mongosh --quiet --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            const d = db.getSiblingDB("migration_ci");
            d.invoices.createIndex({id: 1}, {unique: true});
            d.invoices.insertOne({id: "invoice-1", amount: 100, paid_amount: 25});
            d.payments.insertOne({id: "payment-1", amount: 25});
          '
          "${source[@]}" exec -T database sh -c '
            exec mongodump --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin --db migration_ci --archive --gzip
          ' > migration-ci.archive.gz
          test -s migration-ci.archive.gz
          "${target[@]}" up -d --wait database
          "${target[@]}" exec -T database sh -c '
            exec mongorestore --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin --archive --gzip
          ' < migration-ci.archive.gz
          "${target[@]}" stop database
      - name: Convert only the restored copy and verify it
        shell: bash
        run: |
          set -eu
          target=(docker compose -p surirent-backup-target -f docker-compose.yml -f docker-compose.replica-test.yml)
          source=(docker compose -p surirent-backup-source -f docker-compose.yml)
          "${target[@]}" up -d database replica-init
          wait_for_initializer() {
            for i in {1..120}; do
              container="$("${target[@]}" ps -aq replica-init)"
              if [ -n "$container" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container")" = "exited" ]; then
                "${target[@]}" logs replica-init
                [ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = "0" ]
                return
              fi
              sleep 1
            done
            "${target[@]}" logs database replica-init
            return 1
          }
          verify_copy() {
            "${target[@]}" exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' --eval '
              if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
              const d = db.getSiblingDB("migration_ci");
              if (d.invoices.countDocuments({id: "invoice-1", amount: 100, paid_amount: 25}) !== 1) throw new Error("Invoice missing or changed");
              if (d.payments.countDocuments({id: "payment-1", amount: 25}) !== 1) throw new Error("Payment missing or changed");
              if (!d.invoices.getIndexes().some(i => i.unique && i.key.id === 1)) throw new Error("Unique index missing");
              const session = db.getMongo().startSession();
              const checks = session.getDatabase("migration_ci").checks;
              session.startTransaction();
              checks.insertOne({_id: "commit"});
              session.commitTransaction();
              session.startTransaction();
              checks.insertOne({_id: "abort"});
              session.abortTransaction();
              if (checks.countDocuments({_id: "commit"}) !== 1 || checks.countDocuments({_id: "abort"}) !== 0) throw new Error("Transaction failed");
              checks.deleteMany({});
              session.endSession();
            '
          }
          wait_for_initializer
          verify_copy
          "${target[@]}" restart database
          "${target[@]}" up -d --force-recreate replica-init
          wait_for_initializer
          verify_copy
          "${source[@]}" exec -T database mongosh --quiet --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            if (db.hello().setName) throw new Error("Source was unexpectedly converted");
            const d = db.getSiblingDB("migration_ci");
            if (d.invoices.countDocuments({id: "invoice-1", amount: 100, paid_amount: 25}) !== 1 || d.payments.countDocuments({id: "payment-1", amount: 25}) !== 1) throw new Error("Source data changed");
          '
      - name: Verify app on restored replica and rollback before customer writes
        shell: bash
        run: |
          set -eu
          cat > migration-ci-app.yml <<'EOF'
          services:
            app:
              environment:
                DISABLE_TRIAL_REMINDERS: "1"
                DISABLE_OVERDUE_PUSH: "1"
                DISABLE_AUTO_INVOICE: "1"
                DISABLE_BILLING_CRON: "1"
                DISABLE_INSTALLMENT_REMINDERS: "1"
          EOF
          source=(docker compose -p surirent-backup-source -f docker-compose.yml -f migration-ci-app.yml)
          target=(docker compose -p surirent-backup-target -f docker-compose.yml -f docker-compose.replica-test.yml -f migration-ci-app.yml)
          source_volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data/db"}}{{.Name}}{{end}}{{end}}' "$("${source[@]}" ps -q database)")"
          target_volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data/db"}}{{.Name}}{{end}}{{end}}' "$("${target[@]}" ps -q database)")"
          if [ -z "$source_volume" ] || [ -z "$target_volume" ] || [ "$source_volume" = "$target_volume" ]; then
            echo "Source and restored database volumes must be distinct" >&2
            exit 1
          fi
          verify_app() {
            expected="$1"
            shift
            "$@" exec -T -e EXPECTED_REPLICA="$expected" app python - <<'PY'
          import asyncio
          import os
          from motor.motor_asyncio import AsyncIOMotorClient

          async def main():
              client = AsyncIOMotorClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=10000)
              try:
                  hello = await client.admin.command("hello")
                  expected = os.environ["EXPECTED_REPLICA"]
                  if expected == "yes" and (hello.get("setName") != "rs0" or not hello.get("isWritablePrimary")):
                      raise RuntimeError("The app did not connect to the writable restored replica")
                  if expected == "no" and hello.get("setName"):
                      raise RuntimeError("The rollback app did not connect to the standalone source")
                  db = client["migration_ci"]
                  if await db.invoices.count_documents({"id": "invoice-1", "amount": 100, "paid_amount": 25}) != 1:
                      raise RuntimeError("The app cannot read the restored invoice")
                  if await db.payments.count_documents({"id": "payment-1", "amount": 25}) != 1:
                      raise RuntimeError("The app cannot read the restored payment")
              finally:
                  client.close()

          asyncio.run(main())
          print("Application database connection verified")
          PY
          }
          if ! "${target[@]}" up -d --build --wait --wait-timeout 180 app; then
            "${target[@]}" logs app database replica-init
            exit 1
          fi
          verify_app yes "${target[@]}"
          "${target[@]}" stop app
          if ! "${source[@]}" up -d --build --wait --wait-timeout 180 app; then
            "${source[@]}" logs app database
            exit 1
          fi
          verify_app no "${source[@]}"
          "${target[@]}" exec -T database mongosh --quiet 'mongodb://database:27017/?replicaSet=rs0' --eval '
            if (!db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) throw new Error("Authentication failed");
            if (db.getSiblingDB("migration_ci").invoices.countDocuments({id: "invoice-1", paid_amount: 25}) !== 1) throw new Error("Restored copy changed during rollback");
          '
      - name: Remove isolated containers and volumes
        if: always()
        run: |
          docker compose -p surirent-backup-target -f docker-compose.yml -f docker-compose.replica-test.yml down --volumes --remove-orphans
          docker compose -p surirent-backup-source -f docker-compose.yml down --volumes --remove-orphans
