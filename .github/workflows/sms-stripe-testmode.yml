name: SMS Stripe test-mode payment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-test-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install motor==3.3.1 pymongo==4.5.0 stripe==15.1.0 fastapi==0.110.1 pydantic==2.12.5
      - name: Start isolated MongoDB replica set
        shell: bash
        run: |
          docker run --detach --rm --name sms-stripe-test-mongo \
            --publish 127.0.0.1:27019:27019 mongo:7.0 \
            --replSet rs0 --port 27019 --bind_ip_all
          for i in {1..60}; do
            if docker exec sms-stripe-test-mongo mongosh --port 27019 --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -qx 1; then
              break
            fi
            if [ "$i" = 60 ]; then exit 1; fi
            sleep 1
          done
          docker exec sms-stripe-test-mongo mongosh --port 27019 --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27019"}]})'
          for i in {1..60}; do
            if docker exec sms-stripe-test-mongo mongosh --port 27019 --quiet --eval 'db.hello().isWritablePrimary' | grep -qx true; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify real Stripe test-mode payment and booking
        env:
          PYTHONPATH: backend
          RUN_SMS_STRIPE_TESTMODE: '1'
          SMS_STRIPE_TEST_MONGO_URL: 'mongodb://127.0.0.1:27019/?replicaSet=rs0&directConnection=true'
          SMS_STRIPE_TEST_SECRET_KEY: ${{ secrets.SMS_STRIPE_TEST_SECRET_KEY }}
        run: python -m unittest discover -s backend/tests -p 'test_sms_payment_stripe_testmode.py' -v
      - name: Stop isolated MongoDB
        if: always()
        run: docker stop sms-stripe-test-mongo || true
